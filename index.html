<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Game</title>

  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="purple" data-screen="setup">

<!-- scenery (decoration only) -->
<div class="sky" aria-hidden="true">
  <i class="cloud c1"></i>
  <i class="cloud c2"></i>
  <i class="cloud c3"></i>
</div>
<div class="ground" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<div class="game-box">

  <h1 id="title"></h1>

  <!-- ===== SETUP SCREEN ===== -->
  <div id="setup">
    <h2>Set up your teams</h2>

    <div class="setup-grid">

      <div class="setup-col">
        <div class="field">
          <label for="teamCount">Number of teams:</label>
          <select id="teamCount" autocomplete="off"></select>
        </div>

        <div id="teamNames"></div>

        <div class="field">
          <label for="focusSelect">Questions:</label>
          <select id="focusSelect" autocomplete="off">
            <option value="grammar">Grammar only</option>
            <option value="all">Grammar + facts</option>
          </select>
        </div>

        <div class="field">
          <label for="soundSelect">Sound effects:</label>
          <select id="soundSelect" autocomplete="off">
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </div>

        <div class="field" id="musicField" hidden>
          <label for="musicSelect">Countdown music:</label>
          <select id="musicSelect" autocomplete="off">
            <option value="on">On</option>
            <option value="off">Off</option>
          </select>
        </div>
      </div>

      <div class="setup-col">
        <div class="field">
          <label for="levelSelect">Level:</label>
          <select id="levelSelect" autocomplete="off"></select>
        </div>

        <div class="field">
          <label for="roundCount">Number of rounds:</label>
          <select id="roundCount" autocomplete="off"></select>
          <p id="planSummary" class="hint"></p>
        </div>

        <div class="field">
          <label for="mode">Mode:</label>
          <select id="mode" autocomplete="off">
            <option value="chill">Chill (no timer, no bonus)</option>
            <option value="challenge">Challenge</option>
          </select>
        </div>

        <div id="challengeOptions" hidden>
          <div class="field">
            <label for="timeLimit">Time limit per question:</label>
            <select id="timeLimit" autocomplete="off"></select>
          </div>

          <div class="field">
            <label class="check">
              <input type="checkbox" id="bonusOn" checked> Speed bonus
            </label>
          </div>

          <div class="field" id="bonusWindowRow">
            <label for="bonusWindow">Bonus if correct within:</label>
            <select id="bonusWindow" autocomplete="off"></select>
          </div>
        </div>
      </div>

    </div>

    <p id="rulesLine" class="hint"></p>
    <p id="bankErrors" class="errors" hidden></p>

    <button id="startBtn">Start Game</button>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="game" hidden>
    <div id="scoreboard"></div>

    <div class="status-row">
      <div id="roundDisplay"></div>

      <div id="timerBox" hidden>
        <div class="timer-track" id="timerTrack"><div id="timerFill"></div></div>
        <span id="timerText"></span>
        <span id="bonusTag"></span>
      </div>
    </div>

    <div class="dialogue-box">
      <p id="typeLabel"></p>
      <p id="promptLine"></p>
      <p id="situation"></p>
    </div>

    <div id="options"></div>

    <div id="feedbackBox">
      <p id="feedback"></p>
    </div>

    <div class="actions">
      <button id="pauseBtn" hidden>Pause</button>
      <button id="nextBtn">Next</button>
      <button id="soundBtn" aria-label="Sound on or off" title="Sound on or off"></button>
      <button id="restartBtn" class="restart-btn">Restart Game</button>
    </div>
  </div>

  <!-- ===== RANKING SCREEN ===== -->
  <div id="ranking" hidden>
    <div id="rankingList"></div>
  </div>

</div>

<script src="questions.js"></script>
  <!-- ===== RESTART CONFIRMATION (replaces the browser's plain popup) ===== -->
  <div id="confirmModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirmText">
    <div class="modal-box">
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button id="confirmNo" type="button">Keep playing</button>
        <button id="confirmYes" type="button">Restart</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
